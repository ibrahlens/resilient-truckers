{% extends "admin/base_admin.html" %}

{% block title %}View Message{% endblock %}

{% block content %}

<div class="dashboard">

    <h2>{{ message.subject }}</h2>

    <br>

    <p><strong>Name:</strong> {{ message.full_name }}</p>

    <p><strong>Email:</strong> {{ message.email }}</p>

    <br>

    <p>{{ message.message }}</p>

</div>

{% endblock %}
