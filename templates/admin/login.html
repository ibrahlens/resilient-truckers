<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>RTF Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#eef2f7;">

    <div class="login-card">

        <h2>RTF Admin Login</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error-message">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
