{% extends "admin/base_admin.html" %}

{% block title %}Edit News{% endblock %}

{% block content %}

<div class="dashboard">

    <h2>Edit News Article</h2>

    <form method="POST">

        <div class="form-group">

            <label>Title</label>

            <input
                type="text"
                name="title"
                value="{{ article.title }}"
                required>

        </div>

        <br>

        <div class="form-group">

            <label>Content</label>

            <textarea
                name="content"
                rows="12"
                required>{{ article.content }}</textarea>

        </div>

        <br>

        <button
            type="submit"
            class="view-btn">

            💾 Update Article

        </button>

        <a
            href="{{ url_for('admin.news') }}"
            class="view-btn">

            ← Back

        </a>

    </form>

</div>

{% endblock %}
